#:schema node_modules/wrangler/config-schema.json
name = "cf-visit-gateway"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# 账号里有多个 Cloudflare 账号（例如还留着 --temporary 生成的临时预览账号）时，
# 非交互环境下 wrangler 无法自动选择，会报 "More than one account available"。
# 这里固定绑到本项目所属账号；换成你自己的账号 ID 或删掉这一行即可（也可用环境变量 CLOUDFLARE_ACCOUNT_ID 覆盖）。
account_id = "05389e0b486b83cef368ded14cf44c21"

# ---------------------------------------------------------------------------
# 自定义域名（这是「域名打不开」的唯一开关）
#
# custom_domain = true 会让 wrangler deploy 自动为该主机名创建代理 A/AAAA 记录
# 并签发证书；前提是该域名（zone）已在本账号下把 NS 指向 Cloudflare。
#
# 裸域与 www 是两个不同的主机名，必须各自绑定一条。
# 若该主机名上已有 A/AAAA/CNAME 记录，部署会报冲突，需先删掉冲突记录（或改用面板绑定）。
#
# 不需要自定义域名时，把这两段删掉（或注释掉）再部署即可，workers.dev 地址照常可用。
# 绑定进度可用 `npm run doctor` 从外部体检。
# ---------------------------------------------------------------------------
[[routes]]
pattern = "heyiwei.asia"
custom_domain = true

[[routes]]
pattern = "www.heyiwei.asia"
custom_domain = true

# ---------------------------------------------------------------------------
# 江苏省奶蛙中学.com（IDN，punycode 形式）
#
# apex 上已经存在一条「已代理」的 A 记录，custom_domain 会因记录冲突而失败，
# 所以 apex 改用 route 挂载：route 不需要新建 DNS 记录，只要该主机名的记录是已代理状态即可生效。
# www 子域原本没有记录，用 custom_domain 让 Cloudflare 自己创建。
# ---------------------------------------------------------------------------
[[routes]]
pattern = "xn--fiqx8ytpbr55a4embir4ug.com/*"
zone_name = "xn--fiqx8ytpbr55a4embir4ug.com"

[[routes]]
pattern = "www.xn--fiqx8ytpbr55a4embir4ug.com"
custom_domain = true

# 邮箱入口页（收件由 Cloudflare Email Routing 转发到常用邮箱，本页只做状态展示与跳转）
[[routes]]
pattern = "mail.xn--fiqx8ytpbr55a4embir4ug.com"
custom_domain = true

# ---------------------------------------------------------------------------
# 运行时配置（改完执行 wrangler deploy 生效，无需改代码）
#
# ⚠️ 密钥类配置一律不要写在这个文件里 —— 它会进 git 仓库。
#    请用 secret 下发（值不会出现在仓库、构建产物、客户端或日志里）：
#      npx wrangler secret put API_SECRET     # 隐藏接口路径 + 客户端签名盐
#      npx wrangler secret put ADMIN_TOKEN    # 仅用于 /<prefix>/r 清零与 /<prefix>/h 自检
#    未配置 API_SECRET 时可用，但接口路径退化为公开默认盐，仅具备混淆强度。
# ---------------------------------------------------------------------------
[vars]
TARGET_URL = "https://www.yzzx.org"  # 跳转目标。只接受 http/https，其它协议自动回退默认值
SITE_TITLE = "本站访客统计"           # 页面标题
TZ_OFFSET = "8"                     # 统计"今日"所用时区偏移（小时，8 = 北京时间）
AUTO_REDIRECT = "0"                 # >0 时页面倒计时 N 秒自动跳转；0 = 只点击跳转
MIN_INTERVAL_MS = "1200"            # 同一 IP 的最小计数间隔（防刷新刷量）
ENABLE_BADGE = "false"              # true 才开放 /<prefix>/b 徽章（等同公开只读计数）

# --- 邮箱入口页 mail.江苏省奶蛙中学.com ---
MAIL_ZONE_LABEL = "江苏省奶蛙中学.com"  # 页面上展示的可读域名
MAIL_FORWARD_TO = "228077668@qq.com"  # 收件转发目标（页面上会脱敏展示）
MAIL_DASH_URL = "https://dash.cloudflare.com/05389e0b486b83cef368ded14cf44c21/xn--fiqx8ytpbr55a4embir4ug.com/email/routing"

# ---------------------------------------------------------------------------
# 精确计数：Durable Object（Free 计划仅支持 SQLite 后端，必须用 new_sqlite_classes）
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]

# ---------------------------------------------------------------------------
# KV 回退（可选）：`wrangler kv namespace create VISITS` 后取消注释并填 id。
# 仅在未绑定 COUNTER 时生效，用于无法配置 Durable Object 的场景（近似统计）。
# ---------------------------------------------------------------------------
# [[kv_namespaces]]
# binding = "VISITS"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"

# ---------------------------------------------------------------------------
# 静态资源：.html 作为文本模块、.jpg 作为二进制模块打包，Worker 内 import 即可使用
# ---------------------------------------------------------------------------
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.jpg"]
fallthrough = true

[observability]
enabled = true
