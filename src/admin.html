<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>管理台 · 奶蛙中学</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style nonce="{{NONCE}}">
  :root {
    --bg: #050506; --fg: #f5f5f7; --ink: #8a8a8f; --soft: #63636a;
    --hair: rgba(255,255,255,.09); --hair2: rgba(255,255,255,.18);
    --ok: #3fa86a; --warn: #d8bb62; --err: #d98b86;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.65; -webkit-font-smoothing: antialiased;
  }
  .wrap { width: min(880px, 100%); margin: 0 auto; padding: 44px 24px 90px; }
  .seam { height: 1px; background: linear-gradient(90deg, transparent, var(--hair2) 20%, var(--hair2) 80%, transparent); margin: 0 0 26px; }
  .kicker { font-family: var(--mono); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--soft); margin: 0 0 18px; }
  h1 { font-size: 26px; font-weight: 500; letter-spacing: -.02em; margin: 0 0 6px; }
  .sub { color: var(--ink); margin: 0 0 26px; font-size: 13px; }
  .card { border: 1px solid var(--hair); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; font-weight: 500; margin: 0 0 14px; }

  /* 三步向导 */
  .steps { list-style: none; margin: 0; padding: 0; counter-reset: step; }
  .steps li { position: relative; padding: 14px 0 14px 42px; border-bottom: 1px solid var(--hair); }
  .steps li:last-child { border-bottom: 0; padding-bottom: 0; }
  .steps li::before {
    counter-increment: step; content: counter(step);
    position: absolute; left: 0; top: 14px; width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 11px; color: var(--soft);
    border: 1px solid var(--hair2);
  }
  .steps li.done::before { content: "✓"; color: var(--ok); border-color: rgba(63,168,106,.5); }
  .steps li.active::before { color: var(--fg); border-color: var(--fg); }
  .steps b { display: block; font-weight: 500; font-size: 13.5px; margin-bottom: 8px; }
  .steps .hint { color: var(--soft); font-size: 12px; margin: 6px 0 0; }
  .next {
    margin: 0 0 16px; padding: 11px 14px; border-radius: 10px;
    background: rgba(255,255,255,.04); border: 1px solid var(--hair);
    font-size: 12.5px; color: var(--fg); letter-spacing: .01em;
  }
  .next.done { border-color: rgba(63,168,106,.35); color: var(--ok); }
  .next.act { border-color: var(--hair2); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button {
    font: inherit; font-size: 13px; padding: 9px 18px; border-radius: 980px; cursor: pointer;
    border: 1px solid var(--hair2); background: transparent; color: var(--fg);
    transition: background-color .2s ease, border-color .2s ease, opacity .2s ease;
  }
  button:hover:not(:disabled) { background: rgba(255,255,255,.06); }
  button.primary { background: var(--fg); color: #0a0a0c; border-color: var(--fg); }
  button.primary:hover:not(:disabled) { background: #fff; }
  button.danger { border-color: rgba(217,139,134,.45); color: var(--err); }
  button.danger:hover:not(:disabled) { background: rgba(217,139,134,.1); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  input[type="text"], input[type="password"] {
    font: inherit; font-size: 13px; padding: 9px 14px; border-radius: 9px; min-width: 250px;
    border: 1px solid var(--hair2); background: rgba(255,255,255,.03); color: var(--fg);
  }
  input:focus { outline: 2px solid var(--hair2); outline-offset: 1px; }
  .status { font-family: var(--mono); font-size: 11.5px; letter-spacing: .04em; margin: 14px 0 0; min-height: 18px; }
  .status.ok { color: var(--ok); } .status.warn { color: var(--warn); } .status.err { color: var(--err); }
  .warnbar {
    border: 1px solid rgba(216,187,98,.35); background: rgba(216,187,98,.06); color: var(--warn);
    border-radius: 10px; padding: 12px 14px; font-size: 12.5px; margin-bottom: 16px;
  }
  .tabs { display: flex; gap: 8px; margin: 0 0 14px; flex-wrap: wrap; align-items: center; }
  .tabs button { padding: 7px 16px; font-size: 12.5px; }
  .tabs button[aria-selected="true"] { background: rgba(255,255,255,.09); border-color: var(--hair2); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--hair); }
  .list li:last-child { border-bottom: 0; }
  .meta { flex: 1; min-width: 0; }
  .meta b { font-weight: 500; word-break: break-word; }
  .meta span { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--soft); letter-spacing: .04em; margin-top: 3px; }
  .thumb { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; border: 1px solid var(--hair); flex: none; }
  .empty { color: var(--soft); font-size: 12.5px; padding: 10px 0; }
  .hide { display: none !important; }

  .msg-body {
    margin: 8px 0 10px; padding: 10px 12px; border-radius: 9px; background: rgba(255,255,255,.03);
    border: 1px solid var(--hair); font-size: 13px; line-height: 1.75; white-space: pre-wrap; word-break: break-word;
  }
  .reply-input {
    width: 100%; min-height: 58px; padding: 9px 12px; border-radius: 9px; resize: vertical;
    border: 1px solid var(--hair2); background: rgba(255,255,255,.03); color: var(--fg);
    font: inherit; font-size: 13px; line-height: 1.7;
  }
  .reply-input:focus { outline: 2px solid var(--hair2); outline-offset: 1px; }
  .msg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

  /* 站内确认弹窗（替代原生 confirm） */
  .ask { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 22px; }
  .ask[hidden] { display: none; }
  .ask-scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .72); }
  .ask-panel {
    position: relative; z-index: 1; width: min(420px, 100%); padding: 22px;
    background: #101014; border: 1px solid var(--hair2); border-radius: 14px;
    box-shadow: 0 40px 120px -40px rgba(0, 0, 0, .95);
  }
  .ask-kicker { margin: 0 0 10px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--soft); }
  .ask-panel h3 { margin: 0 0 10px; font-size: 15px; font-weight: 500; }
  .ask-panel p { margin: 0 0 18px; font-size: 13px; line-height: 1.8; color: var(--ink); word-break: break-all; }
  .ask-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .ask-actions button { font: inherit; font-size: 13px; padding: 9px 20px; border-radius: 980px; cursor: pointer; border: 1px solid var(--hair2); background: transparent; color: var(--fg); }
  .ask-actions button:hover { background: rgba(255,255,255,.06); }
  .ask-actions button.primary { background: var(--fg); color: #0a0a0c; border-color: var(--fg); }
  .ask-actions button.primary:hover { background: #fff; }
  .ask-actions button.danger { border-color: rgba(217,139,134,.45); color: var(--err); }
  .ask-actions button.danger:hover { background: rgba(217,139,134,.1); }
  .domain { font-family: var(--mono); font-size: 11.5px; color: var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <div class="seam"></div>
  <p class="kicker">Admin &middot; 奶蛙中学</p>
  <h1>管理台</h1>
  <p class="sub">按顺序做完两步，这台电脑就能用 passkey 一键进管理台。</p>

  <div id="warnbar" class="warnbar hide"></div>

  <section class="card" id="bind-card">
    <h2>绑定这台电脑</h2>
    <p class="next" id="next-action">正在读取状态…</p>
    <ol class="steps">
      <li id="step1" class="active">
        <b>第 1 步 · 输入一次管理令牌</b>
        <div class="row" id="token-row">
          <input type="password" id="token-input" placeholder="管理令牌" autocomplete="off">
          <button class="primary" id="btn-token" type="button">验证令牌</button>
        </div>
        <p class="hint" id="step1-hint">令牌在项目根目录的 .dev.vars 文件里，也等于 Worker 上配置的那个同名 Secret。只用于这次绑定。</p>
      </li>
      <li id="step2">
        <b>第 2 步 · 添加这台电脑的 passkey</b>
        <div class="row">
          <button class="primary" id="btn-register" type="button">添加这台电脑的 passkey</button>
          <button id="btn-login" type="button" class="hide">用已有的 passkey 登录</button>
        </div>
        <p class="hint" id="step2-hint">先完成第 1 步（输入令牌）才能绑定。</p>
      </li>
      <li id="step3">
        <b>第 3 步 · 完成</b>
        <p class="hint" id="step3-hint">绑好后，以后打开这个页面点一下就能进。</p>
      </li>
    </ol>
    <p class="status" id="bind-status"></p>
  </section>

  <div class="ask" id="ask" hidden role="dialog" aria-modal="true" aria-labelledby="ask-title">
    <div class="ask-scrim" data-ask="cancel"></div>
    <div class="ask-panel">
      <p class="ask-kicker">Confirm</p>
      <h3 id="ask-title">确认</h3>
      <p id="ask-body"></p>
      <div class="ask-actions">
        <button id="ask-cancel" type="button">取消</button>
        <button id="ask-ok" class="primary danger" type="button">确认</button>
      </div>
    </div>
  </div>

  <section id="manage" class="hide">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="danmaku">弹幕</button>
      <button role="tab" aria-selected="false" data-tab="uploads">图片</button>
      <button role="tab" aria-selected="false" data-tab="keys">密钥</button>
      <button role="tab" aria-selected="false" data-tab="messages">私信</button>
      <button role="tab" aria-selected="false" data-tab="blocks">黑名单</button>
      <button id="btn-logout" type="button" style="margin-left:auto">退出</button>
    </div>
    <div class="card">
      <ul class="list" id="list"></ul>
      <p class="empty hide" id="empty">这里还是空的。</p>
      <p class="status" id="panel-status"></p>
    </div>
  </section>
</div>

<script nonce="{{NONCE}}">
  "use strict";

  const $ = (id) => document.getElementById(id);
  const b64u = {
    enc(buf) {
      const b = new Uint8Array(buf);
      let s = "";
      for (let i = 0; i < b.length; i += 1) s += String.fromCharCode(b[i]);
      return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    },
    dec(str) {
      const s = String(str).replace(/-/g, "+").replace(/_/g, "/");
      const bin = atob(s + (s.length % 4 ? "=".repeat(4 - (s.length % 4)) : ""));
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i);
      return out;
    },
  };

  let state = { authed: false, passkeys: [], passkeyCount: 0, rpId: "", vault: false, uploads: false };
  let tab = "danmaku";
  let cache = { danmaku: [], uploads: [], blocks: [], messages: [] };

  /** 站内确认弹窗，替代 window.confirm（返回 Promise<boolean>） */
  function askConfirm(options) {
    return new Promise((resolve) => {
      const box = $("ask");
      if (!box) return resolve(window.confirm(options.body || "确认？"));
      $("ask-title").textContent = options.title || "确认";
      $("ask-body").textContent = options.body || "";
      const ok = $("ask-ok");
      const cancel = $("ask-cancel");
      ok.textContent = options.okLabel || "确认";
      ok.className = "primary" + (options.danger === false ? "" : " danger");
      box.hidden = false;
      cancel.focus();

      function done(value) {
        box.hidden = true;
        ok.removeEventListener("click", onOk);
        cancel.removeEventListener("click", onCancel);
        box.removeEventListener("click", onScrim);
        document.removeEventListener("keydown", onKey);
        resolve(value);
      }
      const onOk = () => done(true);
      const onCancel = () => done(false);
      const onScrim = (e) => {
        if (e.target && e.target.nodeType === 1 && e.target.getAttribute("data-ask") === "cancel") done(false);
      };
      const onKey = (e) => {
        if (e.key === "Escape") done(false);
        if (e.key === "Enter") done(true);
      };
      ok.addEventListener("click", onOk);
      cancel.addEventListener("click", onCancel);
      box.addEventListener("click", onScrim);
      document.addEventListener("keydown", onKey);
    });
  }

  function say(id, text, kind) {
    const el = $(id);
    el.textContent = text || "";
    el.className = "status" + (kind ? " " + kind : "");
  }

  function explain(err) {
    const name = (err && err.name) || "";
    if (name === "NotAllowedError") {
      return "系统窗口被取消或超时了。再点一次；如果一直不弹出，先确认这台电脑设置过 Windows Hello（PIN / 指纹 / 人脸）。";
    }
    if (name === "SecurityError") {
      return "域名不匹配：passkey 只能绑定当前域名（" + state.rpId + "）。别用 IP 或 *.workers.dev 地址访问。";
    }
    if (name === "InvalidStateError") {
      return "这台设备已经注册过 passkey 了，直接点「用已有的 passkey 登录」。";
    }
    if (name === "NotSupportedError" || name === "ConstraintError") {
      return "当前浏览器或系统不支持 passkey（需要 Windows Hello、Touch ID 或安全密钥）。";
    }
    if (name === "AbortError") return "操作被中断，重试一次。";
    return (err && err.message) || String(err);
  }

  async function api(path, options) {
    const res = await fetch("/admin/api" + path, {
      method: (options && options.method) || "GET",
      headers: { "content-type": "application/json" },
      credentials: "same-origin",
      body: options && options.body ? JSON.stringify(options.body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "HTTP " + res.status);
    return data;
  }

  async function refresh() {
    try {
      state = await api("/session");
    } catch (err) {
      say("bind-status", "读取状态失败：" + explain(err), "err");
      return;
    }

    const hasKey = (state.passkeyCount ?? state.passkeys.length) > 0;
    const label = $("domain-label");
    if (label) label.textContent = state.rpId || location.hostname;

    $("bind-card").classList.toggle("hide", state.authed && hasKey);

    // 有 passkey 之后，令牌这一步整体隐藏（不是置灰）
    $("step1").classList.toggle("hide", hasKey);

    // 单一出口：现在该做什么，只有这里算
    const next = $("next-action");
    if (state.authed && hasKey) {
      next.textContent = "已登录。要给另一台设备绑定，点「再添加一个 passkey」。";
      next.className = "next done";
    } else if (!state.authed && hasKey) {
      next.textContent = "这台电脑已有 passkey —— 点「用这台电脑的 passkey 登录」，确认一次即可进入。";
      next.className = "next act";
    } else if (!state.authed && !hasKey) {
      next.textContent = "首次使用（系统里还没有任何 passkey）：粘一次性令牌完成引导，之后令牌自动失效。";
      next.className = "next act";
    } else {
      next.textContent = "令牌已通过：点「添加这台电脑的 passkey」，在系统窗口里确认一次。";
      next.className = "next act";
    }

    const step1 = $("step1");
    step1.classList.toggle("done", state.authed);
    step1.classList.toggle("active", !state.authed);
    $("token-row").classList.toggle("hide", state.authed);
    $("step1-hint").textContent = state.authed
      ? "令牌已验证 ✓"
      : "令牌在项目根目录的 .dev.vars 文件里，也等于 Worker 上配置的那个同名 Secret。只用于这次绑定。";

    const step2 = $("step2");
    step2.classList.toggle("done", hasKey);
    step2.classList.toggle("active", state.authed && !hasKey);
    $("btn-register").disabled = false;
    $("btn-register").textContent = hasKey ? "再添加一个 passkey" : "添加这台电脑的 passkey";
    $("btn-register").classList.toggle("primary", state.authed || hasKey);
    $("btn-login").classList.toggle("primary", !state.authed && hasKey);
    $("btn-login").classList.toggle("hide", !hasKey || state.authed);
    if (!state.authed) {
      $("step2-hint").textContent = "先完成第 1 步（输入令牌）才能绑定。";
    } else if (hasKey) {
      $("step2-hint").textContent = "已绑定 " + state.passkeys.length + " 个（域名 " + state.rpId + "），可以再给另一台设备绑一个。";
    } else {
      $("step2-hint").textContent = "现在可以绑定了。点按钮后系统会弹 Windows Hello / 指纹窗口，确认一次即可。绑定域名：" + state.rpId + "。";
    }

    $("step3").classList.toggle("done", hasKey);
    $("step3-hint").textContent = hasKey
      ? "完成。以后打开这个页面点一下就能进；令牌步骤已从本页移除。"
      : "绑好后，以后打开这个页面点一下就能进。";

    $("manage").classList.toggle("hide", !state.authed);

    const warnings = [];
    if (state.authed && !hasKey) warnings.push("这台电脑还没绑定 passkey（第 2 步）：当前只是令牌的临时会话，30 分钟内有效，建议顺手绑一下。");
    if (state.vault === false) warnings.push("Vault 未绑定：弹幕与图片的增删不会落库，检查 wrangler.toml 的 VAULT 绑定。");
    if (state.uploads === false) warnings.push("UPLOADS 未绑定：图片无法保存，检查 KV 绑定。");
    const bar = $("warnbar");
    bar.classList.toggle("hide", warnings.length === 0);
    bar.textContent = warnings.join(" ");

    if (state.authed) await loadList();
  }

  function credToJSON(cred) {
    const r = cred.response;
    const out = { id: cred.id };
    if (r.attestationObject) {
      out.response = { clientDataJSON: b64u.enc(r.clientDataJSON), attestationObject: b64u.enc(r.attestationObject) };
    } else {
      out.response = {
        clientDataJSON: b64u.enc(r.clientDataJSON),
        authenticatorData: b64u.enc(r.authenticatorData),
        signature: b64u.enc(r.signature),
        userHandle: r.userHandle ? b64u.enc(r.userHandle) : null,
      };
    }
    return out;
  }

  let busy = false;

  async function register(auto) {
    if (busy) return;
    if (!state.authed) {
      say("bind-status", "还没验证令牌：先把令牌粘进第 1 步的输入框，点「验证令牌」，我会自动接着走这一步。", "warn");
      const input = $("token-input");
      if (input) input.focus();
      return;
    }
    if (!window.PublicKeyCredential) {
      say("bind-status", "这个浏览器不支持 passkey（需要较新的 Chrome / Edge / Safari）。", "err");
      return;
    }
    busy = true;
    say("bind-status", auto ? "令牌已通过，正在弹出系统验证窗口…" : "正在请求系统验证…", "warn");
    try {
      const opts = await api("/passkey/options", { method: "POST", body: { mode: "register" } });
      const pk = opts.publicKey;
      pk.challenge = b64u.dec(pk.challenge);
      pk.user.id = b64u.dec(pk.user.id);
      const cred = await navigator.credentials.create({ publicKey: pk });
      if (!cred) throw new Error("系统没有返回凭据");
      await api("/passkey/register", {
        method: "POST",
        body: { response: credToJSON(cred).response, name: navigator.userAgent.slice(0, 40) },
      });
      say("bind-status", "绑定成功 ✓ 这台电脑以后可以直接登录", "ok");
      await refresh();
    } catch (err) {
      say("bind-status", "绑定失败：" + explain(err), "err");
    } finally {
      busy = false;
    }
  }

  async function login() {
    say("bind-status", "正在请求系统验证…", "warn");
    try {
      const opts = await api("/passkey/options", { method: "POST", body: { mode: "login" } });
      const pk = opts.publicKey;
      pk.challenge = b64u.dec(pk.challenge);
      pk.allowCredentials = (pk.allowCredentials || []).map((c) => ({ ...c, id: b64u.dec(c.id) }));
      const cred = await navigator.credentials.get({ publicKey: pk });
      if (!cred) throw new Error("系统没有返回凭据");
      await api("/passkey/login", { method: "POST", body: { id: cred.id, response: credToJSON(cred).response } });
      say("bind-status", "登录成功 ✓", "ok");
      await refresh();
    } catch (err) {
      say("bind-status", "登录失败：" + explain(err), "err");
    }
  }

  async function tokenLogin() {
    const token = $("token-input").value.trim();
    if (!token) return say("bind-status", "请先填入令牌", "warn");
    say("bind-status", "正在验证令牌…", "warn");
    try {
      await api("/token", { method: "POST", body: { token } });
      $("token-input").value = "";
      say("bind-status", "令牌通过 ✓ 正在接着弹出系统验证窗口…", "ok");
      await refresh();
      // 用户刚点过按钮，仍处于用户激活期内，直接进入注册可以省掉第二次点击
      await register(true);
    } catch (err) {
      say("bind-status", "令牌验证失败：" + explain(err), "err");
    }
  }

  async function loadList() {
    try {
      const [data, blocked, msgs] = await Promise.all([
        api("/list"),
        api("/blocks").catch(() => ({ items: [] })),
        api("/messages").catch(() => ({ items: [] })),
      ]);
      cache = {
        danmaku: data.danmaku || [],
        uploads: data.uploads || [],
        blocks: blocked.items || [],
        messages: msgs.items || [],
      };
      render();
    } catch (err) {
      say("panel-status", "读取失败：" + explain(err), "err");
    }
  }

  function when(ts) {
    return ts ? new Date(ts).toLocaleString("zh-CN", { hour12: false }) : "—";
  }

  function render() {
    const list = $("list");
    list.innerHTML = "";
    let items = [];

    if (tab === "messages") {
      $("empty").classList.toggle("hide", cache.messages.length > 0);
      for (const m of cache.messages) {
        const li = document.createElement("li");
        li.style.flexDirection = "column";
        li.style.alignItems = "stretch";

        const meta = document.createElement("div");
        meta.className = "meta";
        const b = document.createElement("b");
        b.textContent = (m.name || "匿名") + (m.contact ? " · " + m.contact : "");
        const sp = document.createElement("span");
        sp.textContent =
          when(m.created) + " · IP " + (m.ip || "—") +
          (m.bfp ? " · 指纹 " + m.bfp + "/" + (m.dfp || "—") : "") +
          (m.replied ? " · 已回复" : " · 待回复");
        meta.append(b, sp);
        li.appendChild(meta);

        const body = document.createElement("div");
        body.className = "msg-body";
        body.textContent = m.body;
        li.appendChild(body);

        const ta = document.createElement("textarea");
        ta.className = "reply-input";
        ta.placeholder = "回复内容（会显示给留言者，最多 500 字）";
        ta.maxLength = 500;
        ta.value = m.reply || "";
        li.appendChild(ta);

        const actions = document.createElement("div");
        actions.className = "msg-actions";
        const send = document.createElement("button");
        send.type = "button";
        send.className = "primary";
        send.textContent = m.replied ? "更新回复" : "回复";
        send.addEventListener("click", async () => {
          send.disabled = true;
          try {
            await api("/message/reply", { method: "POST", body: { id: m.id, reply: ta.value } });
            say("panel-status", "回复已保存", "ok");
            await refresh();
          } catch (err) {
            say("panel-status", "保存失败：" + explain(err), "err");
            send.disabled = false;
          }
        });
        actions.appendChild(send);

        const drop = document.createElement("button");
        drop.type = "button";
        drop.className = "danger";
        drop.textContent = "删除";
        drop.addEventListener("click", async () => {
          const ok = await askConfirm({
            title: "删除这条私信？",
            body: (m.name || "匿名") + "：" + String(m.body).slice(0, 60) + (String(m.body).length > 60 ? "…" : ""),
            okLabel: "删除",
          });
          if (!ok) return;
          drop.disabled = true;
          try {
            await api("/delete", { method: "POST", body: { kind: "message", id: m.id } });
            say("panel-status", "已删除", "ok");
            await refresh();
          } catch (err) {
            say("panel-status", "删除失败：" + explain(err), "err");
            drop.disabled = false;
          }
        });
        actions.appendChild(drop);

        li.appendChild(actions);

        list.appendChild(li);
      }
      return;
    }

    if (tab === "danmaku") {
      items = cache.danmaku.map((d) => ({
        kind: "danmaku",
        id: d.id,
        title: d.text,
        meta: d.color + " · " + d.size + "px · " + when(d.created) + " · IP " + (d.ip || "—") +
          (d.bfp ? " · 指纹 " + d.bfp + "/" + (d.dfp || "—") : ""),
        ip: d.ip || "",
      }));
    } else if (tab === "uploads") {
      items = cache.uploads.map((u) => ({
        kind: "upload",
        id: u.id,
        title: u.title || u.id,
        meta: u.mime + " · " + (u.bytes / 1024).toFixed(1) + " KB · " + when(u.created) +
          " · IP " + (u.ip || "—") +
          (u.bfp ? " · 指纹 " + u.bfp + "/" + (u.dfp || "—") : ""),
        thumb: "/img/" + u.id,
        ip: u.ip || "",
      }));
    } else if (tab === "blocks") {
      items = cache.blocks.map((b) => ({
        kind: "block",
        id: b.ip,
        title: b.ip,
        meta: "加入于 " + when(b.created) + (b.reason ? " · " + b.reason : "") + " · 该 IP 无法上传图片与发送弹幕",
      }));
    } else {
      items = state.passkeys.map((k) => ({ kind: "passkey", id: k.id, title: k.name || k.id.slice(0, 12), meta: "注册于 " + when(k.created) }));
    }

    $("empty").classList.toggle("hide", items.length > 0);

    for (const item of items) {
      const li = document.createElement("li");
      if (item.thumb) {
        const img = document.createElement("img");
        img.className = "thumb";
        img.src = item.thumb;
        img.alt = "";
        img.loading = "lazy";
        li.appendChild(img);
      }
      const meta = document.createElement("div");
      meta.className = "meta";
      const b = document.createElement("b");
      b.textContent = item.title;
      const sp = document.createElement("span");
      sp.textContent = item.meta;
      meta.append(b, sp);
      li.appendChild(meta);

      const actions = [];

      if (item.kind === "upload" && item.ip) {
        actions.push({
          label: "拉黑",
          className: "",
          onClick: async () => {
            const ok = await askConfirm({
              title: "拉黑这个 IP？",
              body: item.ip + " —— 拉黑后该 IP 无法上传图片与发送弹幕，可在「黑名单」里解除。",
              okLabel: "拉黑",
            });
            if (!ok) return;
            await api("/block", { method: "POST", body: { ip: item.ip, reason: "手动拉黑" } });
            say("panel-status", "已拉黑 " + item.ip, "ok");
            await refresh();
          },
        });
      }

      if (item.kind === "block") {
        actions.push({
          label: "解除",
          className: "",
          onClick: async () => {
            const ok = await askConfirm({
              title: "解除这个 IP 的限制？",
              body: item.ip + " —— 解除后该 IP 可以重新上传图片与发送弹幕。",
              okLabel: "解除",
              danger: false,
            });
            if (!ok) return;
            await api("/unblock", { method: "POST", body: { ip: item.ip } });
            say("panel-status", "已解除 " + item.ip, "ok");
            await refresh();
          },
        });
      }

      for (const act of actions) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = act.label;
        if (act.className) btn.className = act.className;
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          try {
            await act.onClick();
          } catch (err) {
            say("panel-status", act.label + "失败：" + explain(err), "err");
            btn.disabled = false;
          }
        });
        li.appendChild(btn);
      }

      const del = document.createElement("button");
      del.type = "button";
      del.className = "danger";
      del.textContent = "删除";
      del.addEventListener("click", async () => {
        del.disabled = true;
        try {
          if (item.kind === "passkey") await api("/passkey/remove", { method: "POST", body: { id: item.id } });
          else await api("/delete", { method: "POST", body: { kind: item.kind, id: item.id } });
          say("panel-status", "已删除", "ok");
          await refresh();
        } catch (err) {
          say("panel-status", "删除失败：" + explain(err), "err");
          del.disabled = false;
        }
      });
      if (item.kind !== "block") li.appendChild(del);
      list.appendChild(li);
    }
  }

  $("btn-token").addEventListener("click", tokenLogin);
  $("token-input").addEventListener("keydown", (e) => { if (e.key === "Enter") tokenLogin(); });
  $("btn-register").addEventListener("click", () => register(false));
  $("btn-login").addEventListener("click", login);
  $("btn-logout").addEventListener("click", async () => {
    await api("/logout", { method: "POST" }).catch(() => {});
    await refresh();
  });

  for (const btn of document.querySelectorAll("[data-tab]")) {
    btn.addEventListener("click", () => {
      tab = btn.dataset.tab;
      for (const other of document.querySelectorAll("[data-tab]")) {
        other.setAttribute("aria-selected", String(other === btn));
      }
      render();
    });
  }

  refresh();
</script>
</body>
</html>
