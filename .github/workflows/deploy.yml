name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 测试 / 审计 / 打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 单元 + 集成测试
        run: npm test
      - name: 生成单文件版（顺带校验打包链路）
        run: npm run build:single
      - name: 密钥泄露自检
        run: npm run audit
        env:
          # 审计脚本会拿这两个真实值在全仓库搜索，确认它们没有落到任何文件里
          API_SECRET: ${{ secrets.API_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

  deploy:
    name: 部署 Worker
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      # 先检查 4 个 secret 是否齐全：缺了就明确报缺哪个，
      # 而不是丢一个 wrangler 的晦涩错误让人以为代码有问题。
      - name: 检查 4 个必需 secret
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$API_SECRET" ] && missing="$missing API_SECRET"
          [ -z "$ADMIN_TOKEN" ] && missing="$missing ADMIN_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error title=缺少仓库 Secret::需要在 Settings → Secrets and variables → Actions 添加：$missing"
            echo "生成随机串：node -e \"console.log(crypto.randomBytes(32).toString('base64url'))\""
            exit 1
          fi
          echo "4 个 secret 均已配置 ✓"
      - name: 推送 secret 并发布
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # 这两个值由 wrangler-action 直接写进 Worker secret，不进仓库、不进 wrangler.toml
          secrets: |
            API_SECRET
            ADMIN_TOKEN
        env:
          API_SECRET: ${{ secrets.API_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      # 部署后从外部体检一次：域名绑定失败 / 证书未签发 / 流量没进 Worker 都会被指出来
      - name: 部署后体检
        run: node scripts/doctor.mjs
        continue-on-error: true
        env:
          API_SECRET: ${{ secrets.API_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
