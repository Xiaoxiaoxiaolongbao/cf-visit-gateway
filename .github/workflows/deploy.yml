name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  # PR 也跑一遍「测试 / 审计 / 打包」：它是分支保护里的必需检查，
  # 自动合并（auto-merge）要等它变绿。部署作业只在 push 时执行。
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 测试 / 审计 / 打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 单元 + 集成测试
        run: npm test
      - name: 生成单文件版（顺带校验打包链路）
        run: npm run build:single
      - name: 密钥泄露自检
        run: npm run audit
        env:
          # 审计脚本会拿这两个真实值在全仓库搜索，确认它们没有落到任何文件里
          API_SECRET: ${{ secrets.API_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

  # 先判断仓库里有没有部署所需的 secret。
  # 没有就整体跳过部署（绿），而不是每次推送都红叉——
  # 本地 `npm run deploy` 走的也是同一条 wrangler 链路，产物完全一致。
  preflight:
    name: 检查部署凭据
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      missing: ${{ steps.check.outputs.missing }}
    steps:
      - id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$API_SECRET" ] && missing="$missing API_SECRET"
          [ -z "$ADMIN_TOKEN" ] && missing="$missing ADMIN_TOKEN"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过部署::缺少仓库 Secret:$missing —— 本次只跑测试/审计/打包。需要 CI 自动部署时，在 Settings → Secrets and variables → Actions 里补上即可。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
            echo "4 个 secret 均已配置 ✓"
          fi

  deploy:
    name: 部署 Worker
    needs: preflight
    if: needs.preflight.outputs.ready == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 推送 secret 并发布
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # 这两个值由 wrangler-action 直接写进 Worker secret，不进仓库、不进 wrangler.toml
          secrets: |
            API_SECRET
            ADMIN_TOKEN
        env:
          API_SECRET: ${{ secrets.API_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      # 部署后从外部体检一次：域名绑定失败 / 证书未签发 / 流量没进 Worker 都会被指出来
      - name: 部署后体检
        run: node scripts/doctor.mjs
        continue-on-error: true
        env:
          API_SECRET: ${{ secrets.API_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

  # 没有凭据时给一个明确的收尾提示，避免「部署被跳过」看起来像出错了
  summary:
    name: 结果说明
    needs: [verify, preflight]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 汇总
        run: |
          echo "### 本次运行" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 测试 / 审计 / 打包：${{ needs.verify.result }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.preflight.outputs.ready }}" = "true" ]; then
            echo "- 部署：已触发" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 部署：**已跳过**（缺少 secret：${{ needs.preflight.outputs.missing }}）" >> "$GITHUB_STEP_SUMMARY"
            echo "- 说明：本地执行 \`npm run deploy\` 可完成同样的发布" >> "$GITHUB_STEP_SUMMARY"
          fi
