version: 2

# 依赖更新：每周一提 PR，人工 review 后手动合并（不自动合并）
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      wrangler:
        patterns:
          - wrangler
          - "@cloudflare/*"
      others:
        patterns:
          - "*"
        exclude-patterns:
          - wrangler
          - "@cloudflare/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    commit-message:
      prefix: ci
